name: Build and Release Windows App

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to build and release'
        required: true
        default: 'v1.0.5'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Determine release tag
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RELEASE_TAG="${{ inputs.tag }}"
          else
            VERSION=$(node -p "require('./package.json').version")
            RELEASE_TAG="v${VERSION}"
          fi
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Building ${RELEASE_TAG}"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Windows installer
        run: npm run build-win -- --publish never

      - name: Create GitHub Release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        shell: bash
        run: |
          API_URL="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}"
          STATUS=""

          echo "Checking whether release ${RELEASE_TAG} already exists..."
          for i in 1 2 3 4 5 6; do
            STATUS=$(curl -sS -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${API_URL}" || echo "000")
            echo "GitHub API response: ${STATUS} (attempt ${i}/6)"

            if [ "${STATUS}" = "200" ]; then
              echo "Release ${RELEASE_TAG} already exists. Reusing it."
              exit 0
            fi

            if [ "${STATUS}" = "404" ]; then
              break
            fi

            echo "GitHub API is temporarily unavailable. Waiting 15 seconds..."
            sleep 15
          done

          if [ "${STATUS}" != "404" ]; then
            echo "Could not verify release ${RELEASE_TAG} after multiple attempts."
            exit 1
          fi

          echo "Release ${RELEASE_TAG} does not exist. Creating it..."
          for i in 1 2 3 4 5; do
            if gh release create "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "Gestion Hamza ${RELEASE_TAG}" \
              --generate-notes; then
              echo "Release ${RELEASE_TAG} created successfully."
              exit 0
            fi

            echo "Release creation failed. Waiting 15 seconds before retry ${i}/5..."
            sleep 15

            STATUS=$(curl -sS -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${API_URL}" || echo "000")

            if [ "${STATUS}" = "200" ]; then
              echo "Release ${RELEASE_TAG} now exists. Reusing it."
              exit 0
            fi
          done

          echo "Failed to create release ${RELEASE_TAG}."
          exit 1

      - name: Upload installer to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            if gh release upload "${RELEASE_TAG}" dist/*.exe dist/*.blockmap dist/latest.yml \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber; then
              echo "Installer uploaded successfully."
              exit 0
            fi
            echo "Upload failed. Waiting 15 seconds before retry ${i}/5..."
            sleep 15
          done
          echo "Failed to upload installer after multiple attempts."
          exit 1
