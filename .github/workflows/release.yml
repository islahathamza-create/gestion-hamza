name: Build and Release Windows App

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to build and release (leave empty to use package.json version)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            RELEASE_TAG="${{ inputs.tag }}"
          else
            RELEASE_TAG="v${VERSION}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Building version ${VERSION} as ${RELEASE_TAG}"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Windows installer
        run: npm run build-win -- --publish never

      - name: Verify build files
        shell: bash
        run: |
          echo "Contents of dist/:"
          ls -lah dist
          test -n "$(find dist -maxdepth 1 -name '*.exe' -print -quit)"
          test -n "$(find dist -maxdepth 1 -name '*.blockmap' -print -quit)"
          test -f dist/latest.yml
          echo "Build files verified successfully."

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists. Reusing it."
          else
            echo "Creating release $RELEASE_TAG..."
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Gestion Hamza $RELEASE_TAG" \
              --generate-notes
          fi

      - name: Upload installer and updater files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        shell: bash
        run: |
          gh release upload "$RELEASE_TAG" \
            dist/*.exe \
            dist/*.blockmap \
            dist/latest.yml \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          echo "Release $RELEASE_TAG uploaded successfully."
